services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Agentic Google Workspace Orchestrator}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-password}
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-workspace}:${POSTGRES_PASSWORD:-development-only-password}@db:5432/${POSTGRES_DB:-workspace_orchestrator}"
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_NAMESPACE: ${REDIS_KEY_NAMESPACE:-workspace-orchestrator}
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      DEFAULT_USER_TIMEZONE: ${DEFAULT_USER_TIMEZONE:-Asia/Kolkata}
      DEFAULT_MEETING_DURATION_MINUTES: ${DEFAULT_MEETING_DURATION_MINUTES:-30}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-3600}
      EMBEDDING_WARMUP_ENABLED: ${EMBEDDING_WARMUP_ENABLED:-false}
      INDEX_STALE_AFTER_MINUTES: ${INDEX_STALE_AFTER_MINUTES:-15}
      SYNC_GMAIL_MAX_ITEMS: ${SYNC_GMAIL_MAX_ITEMS:-200}
      SYNC_CALENDAR_LOOKBACK_DAYS: ${SYNC_CALENDAR_LOOKBACK_DAYS:-30}
      SYNC_CALENDAR_LOOKAHEAD_DAYS: ${SYNC_CALENDAR_LOOKAHEAD_DAYS:-90}
      SYNC_DRIVE_MAX_ITEMS: ${SYNC_DRIVE_MAX_ITEMS:-200}
      SYNC_LOCK_TTL_SECONDS: ${SYNC_LOCK_TTL_SECONDS:-900}
      HF_HOME: /tmp/huggingface
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-workspace}:${POSTGRES_PASSWORD:-development-only-password}@db:5432/${POSTGRES_DB:-workspace_orchestrator}"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_NAMESPACE: ${REDIS_KEY_NAMESPACE:-workspace-orchestrator}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-3600}
      INDEX_STALE_AFTER_MINUTES: ${INDEX_STALE_AFTER_MINUTES:-15}
      SYNC_GMAIL_MAX_ITEMS: ${SYNC_GMAIL_MAX_ITEMS:-200}
      SYNC_CALENDAR_LOOKBACK_DAYS: ${SYNC_CALENDAR_LOOKBACK_DAYS:-30}
      SYNC_CALENDAR_LOOKAHEAD_DAYS: ${SYNC_CALENDAR_LOOKAHEAD_DAYS:-90}
      SYNC_DRIVE_MAX_ITEMS: ${SYNC_DRIVE_MAX_ITEMS:-200}
      SYNC_LOCK_TTL_SECONDS: ${SYNC_LOCK_TTL_SECONDS:-900}
      HF_HOME: /tmp/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-workspace}:${POSTGRES_PASSWORD:-development-only-password}@db:5432/${POSTGRES_DB:-workspace_orchestrator}"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_NAMESPACE: ${REDIS_KEY_NAMESPACE:-workspace-orchestrator}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workspace_orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
